name: CI

# T9 (M0) — CLAUDE.md, ARCHITECTURE §11, ADR-016/020.
# MVP sans apps/server (ADR-016) : rien à déployer ici, seulement vérifier le monorepo.
# Dev courant = Supabase cloud (ADR-020) ; la CI utilise Supabase local (Docker du runner)
# pour tout ce qui touche à la base (job `db`).

on:
  pull_request:
  push:
    branches: [main]

# Annule les runs obsolètes du même PR/branche quand de nouveaux commits arrivent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales : lecture seule, aucun job ne publie ni ne commente.
permissions:
  contents: read

jobs:
  # Lint, typecheck, tests unitaires (packages/core, packages/schemas, packages/db,
  # packages/i18n, apps/web), secrets, build web. `apps/app` et `packages/ui` sont gelés
  # depuis ADR-023 : exclus des commandes racine (`--filter=!@repo/app`,
  # `vitest.config.ts` racine) et donc de ce job. Indépendant du job `db` (aucune des
  # deux tâches n'a besoin de l'autre) : les deux tournent en parallèle.
  quality:
    name: Lint, typecheck, tests, build web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `fetch-depth: 0` (historique complet, pas seulement le dernier commit) :
      # requis par l'étape « Check secrets (history) » ci-dessous
      # (scripts/check-secrets.mjs --history rejoue `git log -p --all`).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Version pnpm lue depuis `packageManager` (package.json racine) : aucune version
      # à dupliquer ici.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Check secrets (source)
        run: pnpm check:secrets

      # Historique complet (voir `fetch-depth: 0` ci-dessus) : détecte un secret
      # committé puis supprimé depuis (scripts/check-secrets.mjs, mode --history).
      - name: Check secrets (history)
        run: node scripts/check-secrets.mjs --history

      # `turbo run build --filter=!@repo/app` (script racine `build`, `package.json`) :
      # seul `apps/web` définit un script `build` dans le périmètre CI (`vite build` →
      # `apps/web/dist`, sortie statique). Pas de `VITE_SUPABASE_*` factices ici :
      # `apps/web` lit ces variables via `import.meta.env` au runtime, pas à la
      # construction du bundle, et le client Supabase gère leur absence sans lever
      # d'exception (mêmes garanties que documentées côté `apps/app`, gelé) ; le build
      # n'a donc besoin d'aucune variable Supabase pour réussir.
      - name: Build (apps/web)
        run: pnpm build

      # Deuxième passage volontaire : `apps/web/dist` (bundle construit ci-dessus) doit
      # être scanné comme le reste du dépôt, au cas où une variable VITE_* fautive ou une
      # valeur sensible se serait glissée dans le JS embarqué (scripts/check-secrets.mjs
      # ne saute pas les dossiers `dist`, voir son commentaire).
      - name: Check secrets (build output)
        run: pnpm check:secrets

  # Parcours web Playwright fonctionnels — `apps/web/e2e/**` : le projet `chromium`
  # (serveur de dev, tous les specs hors `e2e/prod/**`) et les specs *non liées à la
  # fluidité* d'`e2e/prod/**` (`pwa.spec.ts`, `catalog-absent.spec.ts`, export de
  # production) exécutés explicitement sur le projet `chromium-perf-prod`. Seul
  # `performance.spec.ts` (fluidité, ADR-017) est sorti de ce job — voir `e2e-web-perf`
  # ci-dessous : ce job-ci reste entièrement bloquant, aucun test fonctionnel n'y est
  # rendu tolérant aux erreurs.
  # Job séparé de `quality` (pas seulement un `step` de plus) : `pnpm e2e:web` démarre
  # ses propres serveurs Vite (`playwright.config.ts`, `webServer`) et prend largement
  # plus longtemps que les autres étapes de `quality` — l'isoler évite de ralentir le
  # retour du job le plus fréquemment consulté (lint/typecheck/test) et permet de
  # publier un rapport Playwright dédié en cas d'échec sans polluer les artefacts de
  # `quality`.
  # Aucun `apps/web/.env` n'est créé ici (ADR-020 : pas de secret Supabase en CI) : les
  # tests qui exigent une configuration Supabase se `test.skip` proprement (mêmes
  # helpers d'environnement qu'en local, vérifiés en simulant l'absence de `.env`).
  # Les autres specs (`navigation`, `preferences`, `calendar`, `dashboard`, `smoke`,
  # `reducedMotion`) tournent sur des données factices, indépendantes de Supabase.
  e2e-web:
    name: Playwright (web) — parcours fonctionnels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium uniquement (les deux projets de `playwright.config.ts`, `chromium` et
      # `chromium-perf-prod`, utilisent le même navigateur) : pas de WebKit/Firefox à
      # installer, moindre coût CI.
      - name: Install Playwright browser (Chromium)
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run Playwright (web) — parcours (dev server)
        run: pnpm --filter @repo/web exec playwright test --project chromium

      # Fichiers explicites (pas tout `e2e/prod/**`) : exclut volontairement
      # `performance.spec.ts`, seul test tolérant à l'échec de ce workflow
      # (voir le job `e2e-web-perf`).
      - name: Run Playwright (web) — PWA et absence du catalogue (export de production)
        run: >
          pnpm --filter @repo/web exec playwright test
          e2e/prod/pwa.spec.ts e2e/prod/catalog-absent.spec.ts
          --project chromium-perf-prod

      # Rapport HTML (`playwright-report/`, config `reporter` de `playwright.config.ts`) +
      # traces/captures d'échec (`test-results/`, `trace: 'retain-on-failure'`,
      # `screenshot: 'only-on-failure'`) — uniquement en cas d'échec, pour ne pas
      # accumuler des artefacts sur chaque run vert.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # Fluidité (ADR-017, `e2e/prod/performance.spec.ts`) : job séparé et volontairement
  # **non bloquant** pour la CI globale tant que la correction de M1-web (W-9) n'est
  # pas terminée — voir ROADMAP.md, dette D1, et l'en-tête de ce fichier de test.
  # `continue-on-error: true` est posé sur ce *job* dédié, jamais en silence sur une
  # étape cachée dans `e2e-web` : son échec apparaît dans l'onglet Checks de la PR avec
  # un statut distinct (⚠, jaune) et n'empêche jamais la fusion, mais reste visible.
  # Dès que W-9 confirme le seuil (moyenne ≥ 55 fps, aucune image > 50 ms) sur
  # `chromium-perf-prod`, retirer `continue-on-error` ici pour rendre le job bloquant
  # (ou le fusionner dans `e2e-web`).
  e2e-web-perf:
    name: Playwright (web) — fluidité (non bloquant, ADR-017)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (Chromium)
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      # `pnpm run build && pnpm run preview` (webServer de `chromium-perf-prod`) :
      # mesure sur l'export de production, jamais le bundle de dev (ADR-017).
      - name: Run Playwright (web) — fluidité (export de production)
        run: >
          pnpm --filter @repo/web exec playwright test
          e2e/prod/performance.spec.ts
          --project chromium-perf-prod

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-perf
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # Migrations, types générés, tests RLS — contre Supabase local (Docker du runner),
  # jamais contre le projet cloud « dev » (ADR-020). Job indépendant de `quality`.
  db:
    name: Supabase (migrations, types, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installe la version de la CLI Supabase déclarée en devDependency
      # (`supabase` dans package.json racine, résolue via pnpm-lock.yaml) : même version
      # qu'en local, pas de dérive.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0

      # Démarre la stack Supabase locale (Postgres, Auth, PostgREST, Storage…) : applique
      # `supabase/migrations/**` et `supabase/seed.sql` une première fois.
      - name: Start Supabase (local, Docker du runner)
        run: supabase start

      # Reset explicite : rejoue les migrations + le seed sur une base propre, à
      # l'identique de `pnpm db:reset` en local (sans le `--linked` destructif utilisé sur
      # le poste dev, ADR-020 — la CI n'a jamais accès au projet cloud).
      - name: Reset local database (migrations + seed)
        run: supabase db reset --local

      # `packages/db/src/database.types.ts` est généré depuis le projet cloud de dev
      # (`pnpm db:types`, ADR-020).
      # Choix volontaire : comparer aux types générés depuis la base *locale* rejouée à
      # partir de `supabase/migrations/**` (la source de vérité, ARCHITECTURE §7), pas
      # depuis le projet cloud — et garder l'étape bloquante (`continue-on-error: false`,
      # valeur par défaut, explicitée ci-dessous) pour ne jamais masquer un futur écart réel
      # entre migrations et types une fois le fichier régénéré pour de bon.
      - name: Verify packages/db/src/database.types.ts is up to date with migrations
        continue-on-error: false
        run: |
          set -euo pipefail
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.generated.ts"
          # Les types commités sont générés depuis le projet cloud (`pnpm db:types`) : ils
          # contiennent un bloc `__InternalSupabase` absent de la génération locale. On compare
          # donc les deux versions normalisées (scripts/normalize-db-types.mjs).
          node scripts/normalize-db-types.mjs packages/db/src/database.types.ts > "$RUNNER_TEMP/committed.normalized.ts"
          node scripts/normalize-db-types.mjs "$RUNNER_TEMP/database.types.generated.ts" > "$RUNNER_TEMP/generated.normalized.ts"
          if ! diff -u "$RUNNER_TEMP/committed.normalized.ts" "$RUNNER_TEMP/generated.normalized.ts"; then
            echo "::error::packages/db/src/database.types.ts ne correspond pas aux types générés depuis supabase/migrations (schéma public, base locale). Le schéma diffère : appliquer la migration sur la base de dev ('pnpm db:push') puis régénérer ('pnpm db:types') — voir docs/RELEASE.md."
            exit 1
          fi

      # Tests RLS (supabase/tests/**/*.test.ts, ex. app_meta.rls.test.ts) : la config
      # supabase/tests/vitest.config.ts n'active pas passWithNoTests (contrairement au
      # vitest.config.ts racine), donc ce job échoue explicitement si aucun test RLS
      # n'existe — jamais de faux vert silencieux sur "no test files found".
      # SUPABASE_URL / SUPABASE_ANON_KEY : lues depuis `supabase status -o env`
      # (variables renommées pour matcher supabase/tests/.env.example) plutôt que codées
      # en dur, afin de suivre les ports/clés réels de cette instance locale.
      - name: Run RLS tests
        run: |
          set -euo pipefail
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            > "$RUNNER_TEMP/supabase-status.env"
          set -a
          source "$RUNNER_TEMP/supabase-status.env"
          set +a
          pnpm test:rls
